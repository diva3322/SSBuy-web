# 命名這個自動化流程
name: Deploy to GitHub Pages

# 設定觸發條件：當 'main' 分支有新的推送(push)時執行
on:
  push:
    branches: ["main"]

# 設定工作流程需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 定義工作內容
jobs:
  build-and-deploy:
    # 使用最新的 Ubuntu 虛擬機來執行
    runs-on: ubuntu-latest
    
    # 定義執行的步驟
    steps:
      # 步驟 1: 從 GitHub 下載您最新上傳的「完美程式碼」
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 步驟 2: 設定 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 步驟 3: 將整個 web 資料夾打包，準備部署 (原封不動打包)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # '.' 代表打包整個根目錄

      # 步驟 4: 將打包好的網站發布出去
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4